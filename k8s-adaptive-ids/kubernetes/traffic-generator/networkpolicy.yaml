# Traffic generator pods may only talk to the lab target services, the decoys
# in ids-deception and cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traffic-generator-egress
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: target-apps
      ports:
        - {protocol: TCP, port: 1880}
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 8086}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ids-deception
          podSelector:
            matchLabels:
              app.kubernetes.io/component: decoy
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
